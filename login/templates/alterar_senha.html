{% extends 'template.html' %}

{% block titulo %}Alterar Senha | ByteFix{% endblock %}

{% block conteudo %}
    <div class="form-card">
        <h2>Alterar Senha</h2>
        <p class="form-sub">Atualize sua senha para manter sua conta protegida e segura.</p>

        <form method="post">
            {% csrf_token %}
            {{ form }}
            <input type="submit" value="Alterar minha senha">
        </form>

        <div class="form-rodape">
            <a href="{% url 'perfil' %}">&larr; Voltar ao meu perfil</a>
        </div>
    </div>
{% endblock %}
