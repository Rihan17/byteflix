{% extends 'template.html' %}

{% block titulo %}Criar Conta | ByteFix{% endblock %}

{% block conteudo %}
    <div class="form-card">
        <h2>Crie sua conta</h2>
        <p class="form-sub">Preencha seus dados para aproveitar todos os nossos recursos.</p>

        <form method="POST">
            {% csrf_token %}
            {{ form }}
            <button type="submit">Criar minha conta</button>
        </form>

        <div class="form-rodape">
            Já possui uma conta? <a href="{% url 'login' %}">Fazer login</a>
        </div>
    </div>
{% endblock %}
