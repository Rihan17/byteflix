{% extends 'template.html' %}

{% block titulo %}Esqueci minha senha | ByteFix{% endblock %}

{% block conteudo %}
    <div class="form-card">
        <h2>Esqueceu sua senha?</h2>
        <p class="form-sub">Informe o e-mail da sua conta e enviaremos um link para você criar uma nova senha.</p>

        <form method="post">
            {% csrf_token %}
            {{ form }}
            <button type="submit">Enviar link de recuperação</button>
        </form>

        <div class="form-rodape">
            <a href="{% url 'login' %}">&larr; Voltar para o login</a>
        </div>
    </div>
{% endblock %}
