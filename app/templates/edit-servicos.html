{% extends 'template.html' %}

{% block titulo %}Editar Serviço | ByteFix{% endblock %}

{% block conteudo %}
    <div class="form-card">
        <h2>Editar Serviço</h2>
        <p class="form-sub">Atualize as informações do serviço cadastrado no catálogo.</p>

        <form method="post" enctype="multipart/form-data">
            {% csrf_token %}
            {{ form }}
            <input type="submit" value="Salvar Alterações">
        </form>
        <div class="form-rodape">
            <a href="{% url 'servicos' %}">Cancelar</a>
        </div>
    </div>
{% endblock %}
