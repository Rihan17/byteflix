{% extends 'template.html' %}

{% block titulo %}Novo Serviço | ByteFix{% endblock %}

{% block conteudo %}
    <div class="form-card">
        <h2>Cadastrar Serviço</h2>
        <p class="form-sub">Preencha as informações abaixo para adicionar um novo serviço ou catálogo.</p>

        <form action="{% url 'addServicos' %}" method="post" enctype="multipart/form-data">
            {% csrf_token %}
            {{ form }}
            <input type="submit" value="Cadastrar Serviço">
        </form>
        <div class="form-rodape">
            <a href="{% url 'servicos' %}">Cancelar</a>
        </div>
    </div>
{% endblock %}
