{% extends "template.html" %}

{% block titulo %}Novo Integrante | ByteFix{% endblock %}

{% block conteudo %}
    <div class="form-card">
        <h2>Novo Integrante</h2>
        <p class="form-sub">Cadastre um novo integrante e apresente sua função e histórico para a equipe.</p>

        <form method="POST" action="{% url 'addIntegrante' %}" class="form-padrao">
            {% csrf_token %}

            <label for="nome">Nome completo:</label>
            <input type="text" name="nome" id="nome" required>

            <label for="cargo">Cargo:</label>
            <input type="text" name="cargo" id="cargo" required>

            <label for="biografia">Biografia:</label>
            <textarea name="biografia" id="biografia" rows="4" required></textarea>

            <label for="foto">Foto (URL):</label>
            <input type="url" name="foto" id="foto">

            <button type="submit" class="btn btn-primary btn-block" style="margin-top:14px;">Cadastrar Integrante</button>
        </form>
        <div class="form-rodape">
            <a href="{% url 'integrantes' %}">Cancelar</a>
        </div>
    </div>
{% endblock %}
